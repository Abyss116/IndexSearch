name: Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: indexsearch-linux-x86_64
            archive: indexsearch-linux-x86_64.tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: indexsearch-macos-aarch64
            archive: indexsearch-macos-aarch64.tar.gz
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: indexsearch-macos-x86_64
            archive: indexsearch-macos-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: indexsearch-windows-x86_64
            archive: indexsearch-windows-x86_64.zip

    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Select stable Rust
        run: rustup default stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/is-daemon.exe" "dist/${{ matrix.artifact }}/"
            cp "target/${{ matrix.target }}/release/indexsearch.exe" "dist/${{ matrix.artifact }}/"
            cp "target/${{ matrix.target }}/release/is.exe" "dist/${{ matrix.artifact }}/"
          else
            cp "target/${{ matrix.target }}/release/is-daemon" "dist/${{ matrix.artifact }}/"
            cp "target/${{ matrix.target }}/release/indexsearch" "dist/${{ matrix.artifact }}/"
            cp "target/${{ matrix.target }}/release/is" "dist/${{ matrix.artifact }}/"
            chmod +x "dist/${{ matrix.artifact }}/is-daemon"
            chmod +x "dist/${{ matrix.artifact }}/indexsearch"
            chmod +x "dist/${{ matrix.artifact }}/is"
          fi
          cp README.md "dist/${{ matrix.artifact }}/"
          cp LICENSE-MIT LICENSE-APACHE "dist/${{ matrix.artifact }}/"
          cp install.sh install.ps1 "dist/${{ matrix.artifact }}/"
          cp index-search-project.txt "dist/${{ matrix.artifact }}/"
          cp -R templates "dist/${{ matrix.artifact }}/"
          cp -R skills "dist/${{ matrix.artifact }}/"
          cp -R agent-rules "dist/${{ matrix.artifact }}/"

      - name: Create tar archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.artifact }}"

      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.artifact }}/*" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -print
          gh release create "$GITHUB_REF_NAME" release-assets/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  update-homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: Abyss116/homebrew-indexsearch
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "skipping Homebrew tap update; HOMEBREW_TAP_TOKEN is not configured"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'indexsearch-linux-x86_64.tar.gz' \
            --pattern 'indexsearch-macos-aarch64.tar.gz' \
            --pattern 'indexsearch-macos-x86_64.tar.gz' \
            --dir assets
          linux_sha="$(sha256sum assets/indexsearch-linux-x86_64.tar.gz | awk '{print $1}')"
          macos_arm_sha="$(sha256sum assets/indexsearch-macos-aarch64.tar.gz | awk '{print $1}')"
          macos_intel_sha="$(sha256sum assets/indexsearch-macos-x86_64.tar.gz | awk '{print $1}')"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/indexsearch.rb <<EOF
          class Indexsearch < Formula
            desc "Persistent-index rg-like search for large source trees"
            homepage "https://github.com/Abyss116/IndexSearch"
            version "${version}"
            license any_of: ["MIT", "Apache-2.0"]

            if OS.linux?
              url "https://github.com/Abyss116/IndexSearch/releases/download/${GITHUB_REF_NAME}/indexsearch-linux-x86_64.tar.gz"
              sha256 "${linux_sha}"
            elsif Hardware::CPU.arm?
              url "https://github.com/Abyss116/IndexSearch/releases/download/${GITHUB_REF_NAME}/indexsearch-macos-aarch64.tar.gz"
              sha256 "${macos_arm_sha}"
            else
              url "https://github.com/Abyss116/IndexSearch/releases/download/${GITHUB_REF_NAME}/indexsearch-macos-x86_64.tar.gz"
              sha256 "${macos_intel_sha}"
            end

            def install
              payload = if File.exist?("indexsearch")
                "."
              else
                Dir["indexsearch-*"].find { |entry| File.directory?(entry) }
              end
              odie "IndexSearch archive layout changed" if payload.nil?
              cd payload do
                bin.install "is-daemon" if File.exist?("is-daemon")
                bin.install "indexsearch"
                if File.exist?("is")
                  bin.install "is"
                else
                  bin.install_symlink "indexsearch" => "is"
                end
                pkgshare.install "skills" if Dir.exist?("skills")
                pkgshare.install "agent-rules" if Dir.exist?("agent-rules")
                pkgshare.install "templates" if Dir.exist?("templates")
              end
            end

            def caveats
              <<~EOS
                Agent integrations are bundled into the binary:
                  is install-skills
                  is install-skills --scope project --project /path/to/project --ue-template
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/indexsearch --version")
              assert_match version.to_s, shell_output("#{bin}/is --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/indexsearch.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
            exit 0
          fi
          git commit -m "indexsearch ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git"

  update-winget:
    name: Submit WinGet manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest
    steps:
      - name: Submit manifest update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Host "skipping WinGet submission; WINGET_TOKEN is not configured"
            exit 0
          }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installerUrl = "https://github.com/Abyss116/IndexSearch/releases/download/$env:GITHUB_REF_NAME/indexsearch-windows-x86_64.zip"
          $url = "$installerUrl|x64"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Abyss116.IndexSearch -u $url -v $version -t $env:WINGET_TOKEN --submit
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }

          Write-Host "wingetcreate update failed. The package may not be accepted into winget-pkgs yet."
          Write-Host "Skipping automatic initial submission to avoid creating duplicate new-package PRs."
          exit 0
