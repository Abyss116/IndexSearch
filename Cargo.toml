[package]
name = "indexsearch"
version = "0.2.3"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
fs2 = "0.4"
globset = "0.4"
libc = "0.2"
lz4_flex = "0.11"
memchr = "2.7"
memmap2 = "0.9"
notify = "8.2"
rayon = "1.10"
regex = "1.11"
rustc-hash = "2.1"
walkdir = "2.5"
