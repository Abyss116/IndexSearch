[package]
name = "indexsearch"
version = "0.3.17"
edition = "2024"
description = "Persistent-index rg-like search for large source trees"
repository = "https://github.com/Abyss116/IndexSearch"
readme = "README.md"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
fs2 = "0.4"
globset = "0.4"
libc = "0.2"
lz4_flex = "0.11"
memchr = "2.7"
memmap2 = "0.9"
notify = "8.2"
rayon = "1.10"
regex = "1.11"
rustc-hash = "2.1"
walkdir = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[[bin]]
name = "is-daemon"
path = "src/main.rs"

[[bin]]
name = "indexsearch"
path = "src/bin/indexsearch.rs"

[[bin]]
name = "is"
path = "src/bin/is.rs"
